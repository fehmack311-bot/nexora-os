
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXORA OS</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#3867f4;--bg:#f4f6fb;--text:#20283a;--muted:#7b8498;--line:#e8ebf3;--white:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{background:white;width:100%;max-width:420px;border-radius:25px;padding:32px;box-shadow:0 15px 50px #263b7310}
.logo{font-size:28px;font-weight:900;letter-spacing:1px;color:var(--blue)}
.logo span{color:#20283a}
.auth-card h1{font-size:25px;margin:25px 0 8px}
.muted{color:var(--muted);font-size:14px;line-height:1.7}
.field{width:100%;padding:14px 15px;border:1px solid var(--line);border-radius:12px;background:#fafbfe;margin:7px 0;outline:none}
.field:focus{border-color:var(--blue)}
.primary{border:0;border-radius:12px;background:var(--blue);color:white;padding:13px 18px;font-weight:bold}
.primary:hover{filter:brightness(.95)}
.full{width:100%;margin-top:12px}
.switch{background:none;border:0;color:var(--blue);font-weight:bold;margin-top:18px}
#app{min-height:100vh}
.topbar{height:74px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 5%;position:sticky;top:0;z-index:5}
.top-actions{display:flex;align-items:center;gap:10px}
.avatar{width:42px;height:42px;border-radius:14px;background:#eaf0ff;color:var(--blue);display:grid;place-items:center;font-weight:bold;flex-shrink:0}
.layout{max-width:1250px;margin:26px auto;padding:0 18px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:22px}
.sidebar{background:white;border:1px solid var(--line);border-radius:20px;padding:14px;height:max-content;position:sticky;top:95px}
.navbtn{display:flex;gap:12px;align-items:center;width:100%;padding:13px;border:0;background:transparent;border-radius:12px;text-align:right;color:#68738a;margin:3px 0}
.navbtn.active,.navbtn:hover{background:#edf2ff;color:var(--blue);font-weight:bold}
.content{min-width:0}
.welcome{background:linear-gradient(120deg,#315cf1,#7389ff);border-radius:22px;padding:27px;color:white;margin-bottom:20px}
.welcome h1{margin:0 0 9px;font-size:25px}
.welcome p{margin:0;opacity:.9;line-height:1.8}
.section-title{font-size:21px;margin:0 0 16px}
.card{background:white;border:1px solid var(--line);border-radius:19px;padding:20px;margin-bottom:17px}
.card-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.card-head strong{display:block}
.small{font-size:12px;color:var(--muted);margin-top:5px}
.postbox textarea{resize:vertical;min-height:95px}
.post{white-space:pre-wrap;line-height:1.9;overflow-wrap:anywhere}
.post-actions{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.softbtn{border:1px solid var(--line);background:white;border-radius:10px;padding:9px 13px;color:#606b82}
.softbtn:hover{background:#f3f6ff}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:20px}
.stat{background:white;border:1px solid var(--line);border-radius:16px;padding:16px}
.stat strong{font-size:22px;display:block;margin-bottom:7px}
.stat span{font-size:12px;color:var(--muted)}
.empty{text-align:center;padding:32px 12px;color:var(--muted);line-height:1.9}
.notice{padding:12px 14px;border-radius:12px;background:#fff5df;color:#76561a;font-size:13px;line-height:1.7;margin:12px 0}
.message-list{display:flex;flex-direction:column;gap:10px}
.message{background:#f0f4ff;border-radius:15px;padding:12px 15px;max-width:85%;align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere}
.message.mine{align-self:flex-end;background:var(--blue);color:white}
.mobile-nav{display:none}
@media(max-width:760px){
 .topbar{padding:0 15px;height:65px}
 .layout{display:block;margin:15px auto;padding:0 12px}
 .sidebar{display:none}
 .mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:10;background:white;border-top:1px solid var(--line);justify-content:space-around;padding:7px 3px calc(7px + env(safe-area-inset-bottom))}
 .mobile-nav .navbtn{display:flex;flex-direction:column;gap:4px;font-size:10px;text-align:center;padding:8px 2px;margin:0}
 .content{padding-bottom:82px}
 .welcome{padding:22px}
 .stats{gap:8px}
 .stat{padding:12px}
 .stat strong{font-size:18px}
 .card{padding:15px}
}
</style>
</head>
<body>

<section id="auth" class="auth-wrap">
 <div class="auth-card">
  <div class="logo">NEXORA<span> OS</span></div>
  <h1 id="authTitle">حيّاك في نكسورا</h1>
  <p class="muted" id="authSubtitle">ادخل حسابك وكمل من مكان ما وقفت.</p>
  <form id="authForm">
   <div id="nameField" class="hidden">
    <label for="displayName" class="muted">اسمك الظاهر</label>
    <input class="field" id="displayName" maxlength="40" placeholder="وش نناديك؟">
   </div>
   <label for="email" class="muted">البريد الإلكتروني</label>
   <input class="field" id="email" type="email" autocomplete="email" required placeholder="you@example.com">
   <label for="password" class="muted">كلمة المرور</label>
   <input class="field" id="password" type="password" minlength="6" required autocomplete="current-password" placeholder="٦ أحرف على الأقل">
   <button class="primary full" id="authSubmit" type="submit">تسجيل الدخول</button>
  </form>
  <button class="switch" id="authSwitch" type="button">ما عندك حساب؟ أنشئ حساب</button>
  <p id="authStatus" class="muted" role="status"></p>
 </div>
</section>

<section id="app" class="hidden">
 <header class="topbar">
  <div class="logo">NEXORA<span> OS</span></div>
  <div class="top-actions">
   <span id="topName" class="muted"></span>
   <div id="topAvatar" class="avatar">N</div>
  </div>
 </header>

 <div class="layout">
  <aside class="sidebar" id="sideNav"></aside>
  <main class="content">
   <section class="welcome">
    <h1 id="welcomeTitle">هلا بك في NEXORA OS 👋</h1>
    <p>مساحتك الخاصة للتواصل ومشاركة أفكارك.</p>
   </section>
   <div class="stats">
    <div class="stat"><strong>∞</strong><span>مساحتك الخاصة</span></div>
    <div class="stat"><strong id="postCount">0</strong><span>منشورات ظاهرة</span></div>
    <div class="stat"><strong id="connectionState">●</strong><span>حالة الحساب</span></div>
   </div>
   <div id="page"></div>
  </main>
 </div>
 <nav class="mobile-nav" id="mobileNav"></nav>
</section>

<script>
(() => {
 'use strict';

 const SUPABASE_URL = 'https://ayfxtomfqrantxmpqgof.supabase.co';
 const SUPABASE_KEY = 'sb_publishable_2d8TzhMCRIuc6daKrObBGA_7i0jUIxe';
 const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

 const $ = id => document.getElementById(id);
 let user = null;
 let profile = {};
 let signupMode = false;
 let currentPage = 'home';
 let posts = [];
 let likes = new Set();

 const navItems = [
  ['home','⌂','الرئيسية'],
  ['messages','✉','المحادثات'],
  ['friends','♧','الأصدقاء'],
  ['groups','◫','المجموعات'],
  ['notifications','♢','الإشعارات'],
  ['profile','◎','ملفي']
 ];

 function safe(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({
   '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  })[c]);
 }
 function initials(name) {
  return (name || 'N').trim().slice(0,1).toUpperCase();
 }
 function status(message, isError=false) {
  $('authStatus').textContent = message;
  $('authStatus').style.color = isError ? '#c43c43' : '#64748b';
 }
 function showAuth() {
  $('auth').classList.remove('hidden');
  $('app').classList.add('hidden');
 }
 function showApp() {
  $('auth').classList.add('hidden');
  $('app').classList.remove('hidden');
  const name = profile.display_name || user?.user_metadata?.display_name || user?.email?.split('@')[0] || 'مستخدم';
  $('topName').textContent = name;
  $('topAvatar').textContent = initials(name);
  $('welcomeTitle').textContent = 'هلا ' + name + ' 👋';
  $('connectionState').textContent = '●';
  $('connectionState').style.color = '#21966b';
  renderNav();
  renderPage();
 }
 function renderNav() {
  const markup = navItems.map(([id,icon,label]) =>
   `<button class="navbtn ${currentPage===id?'active':''}" data-page="${id}" type="button"><span>${icon}</span><span>${label}</span></button>`
  ).join('');
  $('sideNav').innerHTML = markup + `<div class="notice">حسابك مرتبط بمشروع Supabase الحالي.</div><button class="navbtn" id="logout" type="button">↪ تسجيل الخروج</button>`;
  $('mobileNav').innerHTML = markup;
  document.querySelectorAll('[data-page]').forEach(btn => btn.addEventListener('click', () => {
   currentPage = btn.dataset.page;
   renderNav();
   renderPage();
  }));
  $('logout').addEventListener('click', logout);
 }
 function heading(title, subtitle='') {
  return `<h2 class="section-title">${safe(title)}</h2>${subtitle?`<p class="muted">${safe(subtitle)}</p>`:''}`;
 }
 function renderPage() {
  const name = profile.display_name || user?.user_metadata?.display_name || user?.email?.split('@')[0] || 'مستخدم';
  if(currentPage === 'home') {
   $('page').innerHTML = `
    ${heading('مساحتك','شارك أفكارك مع مجتمعك.')}
    <form id="postForm" class="card postbox">
     <div class="card-head"><div class="avatar">${safe(initials(name))}</div><strong>وش في بالك اليوم؟</strong></div>
     <textarea id="postText" class="field" maxlength="2000" placeholder="اكتب منشورك هنا..." required></textarea>
     <button class="primary" type="submit">نشر المنشور</button>
    </form>
    <div id="feed"><div class="empty">جاري تحميل المنشورات...</div></div>`;
   $('postForm').addEventListener('submit', createPost);
   loadPosts();
  } else if(currentPage === 'profile') {
   $('page').innerHTML = `${heading('ملفي الشخصي','حدّث الاسم الظاهر في حسابك.')}
    <form id="profileForm" class="card">
     <label class="muted">الاسم الظاهر</label>
     <input id="profileName" class="field" maxlength="40" required value="${safe(profile.display_name || name)}">
     <label class="muted">البريد الإلكتروني</label>
     <input class="field" disabled value="${safe(user.email || '')}">
     <button class="primary" type="submit">حفظ الاسم</button>
     <p id="profileStatus" class="muted"></p>
    </form>
    <div class="card"><strong>حساب NEXORA</strong><p class="muted">تسجيل الدخول محفوظ في Supabase. ما سوّينا حذف أو تعديل لجداول قاعدة بياناتك.</p></div>`;
   $('profileForm').addEventListener('submit', saveProfile);
  } else if(currentPage === 'messages') {
   $('page').innerHTML = `${heading('المحادثات','واجهة المحادثات الخاصة.')}
    <div class="card">
     <label class="muted">معرّف المستخدم المستلم (UUID)</label>
     <input id="recipientId" class="field" placeholder="معرّف حساب الشخص">
     <div id="chatMessages" class="message-list"><div class="empty">اختر مستخدمًا لعرض المحادثة.</div></div>
     <form id="messageForm">
      <textarea id="messageText" class="field" maxlength="2000" placeholder="اكتب رسالتك..." required></textarea>
      <button class="primary" type="submit">إرسال</button>
     </form>
     <p id="messageStatus" class="muted"></p>
    </div>`;
   $('recipientId').addEventListener('change', loadMessages);
   $('messageForm').addEventListener('submit', sendMessage);
  } else {
   const details = {
    friends:['الأصدقاء','مساحة الأصدقاء وطلبات الصداقة.'],
    groups:['المجموعات','مساحة المجموعات والمحادثات الجماعية.'],
    notifications:['الإشعارات','آخر التنبيهات المرتبطة بحسابك.']
   };
   const d = details[currentPage];
   $('page').innerHTML = `${heading(d[0],d[1])}
    <div class="card"><div class="empty">الواجهة جاهزة، لكن عرض البيانات هنا يحتاج مطابقة أسماء الأعمدة وصلاحيات الجداول الموجودة عندك في Supabase. ما راح أغيّر قاعدة بياناتك عشوائيًا.</div></div>`;
  }
 }

 async function createPost(e) {
  e.preventDefault();
  const textValue = $('postText').value.trim();
  if(!textValue) return;
  const button = e.submitter;
  button.disabled = true;
  button.textContent = 'جاري النشر...';
  try {
   const result = await db.from('nexora_posts').insert({
    user_id:user.id,
    content:textValue
   });
   if(result.error) throw result.error;
   $('postText').value = '';
   await loadPosts();
  } catch(err) {
   alert('ما قدرنا ننشر. قد يكون اسم الجدول أو الأعمدة مختلفًا في قاعدة بياناتك: ' + err.message);
  } finally {
   button.disabled = false;
   button.textContent = 'نشر المنشور';
  }
 }

 async function loadPosts() {
  const feed = $('feed');
  if(!feed) return;
  try {
   const result = await db.from('nexora_posts')
    .select('*').order('created_at',{ascending:false}).limit(30);
   if(result.error) throw result.error;
   posts = result.data || [];
   $('postCount').textContent = posts.length;
   if(!posts.length) {
    feed.innerHTML = '<div class="card empty">ما فيه منشورات للحين. كن أول شخص ينشر! ✨</div>';
    return;
   }
   feed.innerHTML = posts.map(p => {
    const textValue = p.content ?? p.body ?? p.text ?? '';
    const author = p.display_name ?? p.username ?? 'عضو في NEXORA';
    const liked = likes.has(p.id);
    return `<article class="card">
     <div class="card-head"><div class="avatar">${safe(initials(author))}</div>
      <div><strong>${safe(author)}</strong><div class="small">${safe(p.created_at ? new Date(p.created_at).toLocaleString('ar-SA') : 'منشور')}</div></div>
     </div>
     <div class="post">${safe(textValue)}</div>
     <div class="post-actions"><button class="softbtn" data-like="${safe(p.id)}">${liked?'♥ أعجبني':'♡ إعجاب'}</button></div>
    </article>`;
   }).join('');
   feed.querySelectorAll('[data-like]').forEach(btn => btn.addEventListener('click', () => {
    const id = btn.dataset.like;
    likes.has(id) ? likes.delete(id) : likes.add(id);
    renderPage();
   }));
  } catch(err) {
   $('postCount').textContent = '—';
   feed.innerHTML = `<div class="card"><div class="empty">تعذّر تحميل المنشورات.<br>السبب: ${safe(err.message)}<br><br>ما غيّرنا أي جدول. نحتاج نطابق أسماء الأعمدة الموجودة عندك.</div></div>`;
  }
 }

 async function saveProfile(e) {
  e.preventDefault();
  const newName = $('profileName').value.trim();
  if(!newName) return;
  const result = await db.auth.updateUser({data:{display_name:newName}});
  if(result.error) {
   $('profileStatus').textContent = 'تعذّر حفظ الاسم: ' + result.error.message;
   return;
  }
  profile.display_name = newName;
  $('profileStatus').textContent = 'تم تحديث الاسم في حسابك.';
  showApp();
  currentPage = 'profile';
  renderNav();
  renderPage();
  $('profileStatus').textContent = 'تم تحديث الاسم في حسابك.';
 }

 async function loadMessages() {
  const recipient = $('recipientId').value.trim();
  const box = $('chatMessages');
  if(!recipient) return;
  box.innerHTML = '<div class="empty">جاري تحميل المحادثة...</div>';
  try {
   const result = await db.from('nexora_messages').select('*')
    .or(`and(sender_id.eq.${user.id},receiver_id.eq.${recipient}),and(sender_id.eq.${recipient},receiver_id.eq.${user.id})`)
    .order('created_at',{ascending:true}).limit(100);
   if(result.error) throw result.error;
   const rows = result.data || [];
   box.innerHTML = rows.length ? rows.map(m =>
    `<div class="message ${m.sender_id===user.id?'mine':''}">${safe(m.content ?? m.message ?? '')}</div>`
   ).join('') : '<div class="empty">ما فيه رسائل في هالمحادثة.</div>';
  } catch(err) {
   box.innerHTML = `<div class="empty">تعذّر تحميل الرسائل: ${safe(err.message)}<br>قد تختلف أسماء أعمدة جدول المحادثات.</div>`;
  }
 }

 async function sendMessage(e) {
  e.preventDefault();
  const recipient = $('recipientId').value.trim();
  const content = $('messageText').value.trim();
  if(!recipient || !content) {
   $('messageStatus').textContent = 'اكتب معرّف المستلم والرسالة.';
   return;
  }
  try {
   const result = await db.from('nexora_messages').insert({
    sender_id:user.id,receiver_id:recipient,content
   });
   if(result.error) throw result.error;
   $('messageText').value = '';
   $('messageStatus').textContent = 'تم إرسال الرسالة.';
   await loadMessages();
  } catch(err) {
   $('messageStatus').textContent = 'تعذّر الإرسال: ' + err.message;
  }
 }

 async function logout() {
  const result = await db.auth.signOut();
  if(result.error) {
   alert('تعذّر تسجيل الخروج: ' + result.error.message);
   return;
  }
  user = null;
  profile = {};
  showAuth();
 }

 $('authSwitch').addEventListener('click', () => {
  signupMode = !signupMode;
  $('authTitle').textContent = signupMode ? 'أنشئ حسابك' : 'حيّاك في نكسورا';
  $('authSubtitle').textContent = signupMode ? 'خطوة بسيطة وتبدأ.' : 'ادخل حسابك وكمل من مكان ما وقفت.';
  $('nameField').classList.toggle('hidden',!signupMode);
  $('authSubmit').textContent = signupMode ? 'إنشاء الحساب' : 'تسجيل الدخول';
  $('authSwitch').textContent = signupMode ? 'عندك حساب؟ سجّل دخولك' : 'ما عندك حساب؟ أنشئ حساب';
  $('password').autocomplete = signupMode ? 'new-password' : 'current-password';
  status('');
 });

 $('authForm').addEventListener('submit', async e => {
  e.preventDefault();
  const email = $('email').value.trim();
  const password = $('password').value;
  const displayName = $('displayName').value.trim();
  $('authSubmit').disabled = true;
  $('authSubmit').textContent = 'لحظة...';
  status('');
  try {
   if(signupMode) {
    const result = await db.auth.signUp({
     email,password,
     options:{data:{display_name:displayName || email.split('@')[0]}}
    });
    if(result.error) throw result.error;
    if(!result.data.session) {
     status('تم إنشاء الطلب. شيّك بريدك إذا كان تأكيد البريد مفعّلًا في Supabase.');
     return;
    }
    user = result.data.user;
   } else {
    const result = await db.auth.signInWithPassword({email,password});
    if(result.error) throw result.error;
    user = result.data.user;
   }
   profile = {display_name:user.user_metadata?.display_name || ''};
   currentPage = 'home';
   showApp();
  } catch(err) {
   status('صار خطأ: ' + err.message,true);
  } finally {
   $('authSubmit').disabled = false;
   $('authSubmit').textContent = signupMode ? 'إنشاء الحساب' : 'تسجيل الدخول';
  }
 });

 async function init() {
  const result = await db.auth.getSession();
  if(result.error) {
   status('تعذّر التحقق من الجلسة: ' + result.error.message,true);
   return;
  }
  if(result.data.session) {
   user = result.data.session.user;
   profile = {display_name:user.user_metadata?.display_name || ''};
   showApp();
  } else {
   showAuth();
  }
  db.auth.onAuthStateChange((_event,session) => {
   if(session && !user) {
    user = session.user;
    profile = {display_name:user.user_metadata?.display_name || ''};
    showApp();
   } else if(!session && user) {
    user = null;
    showAuth();
   }
  });
 }
 init();
})();
</script>
</body>
</html>
