
<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXORA CHAT</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--a:#3978f6;--bg:#f4f6fa;--panel:#fff;--txt:#202638;--line:#e6eaf1;--muted:#7b8495}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:Arial,"Segoe UI",sans-serif}
button,input,select{font:inherit}button{cursor:pointer}
header{height:68px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.brand{font-weight:800;font-size:21px;display:flex;align-items:center;gap:10px}
.logo{background:var(--a);color:white;border-radius:12px;padding:10px 12px}
.btn{border:0;border-radius:11px;padding:11px 15px;background:var(--a);color:white;font-weight:bold}
.btn2{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:11px;padding:10px 13px}
main{max-width:1150px;margin:22px auto;padding:0 14px}
.layout{display:grid;grid-template-columns:320px 1fr;gap:16px;height:calc(100vh - 112px);min-height:500px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:17px;overflow:hidden;min-width:0}
.side{display:flex;flex-direction:column}.sidehead{padding:18px;border-bottom:1px solid var(--line)}
h2{font-size:19px;margin:0 0 14px}.search,input,select{background:var(--panel);color:var(--txt);border:1px solid var(--line);border-radius:11px;padding:12px;width:100%;outline:none}
.search{background:var(--bg)}input:focus,select:focus{border-color:var(--a)}
.me{padding:15px 18px;display:flex;gap:10px;align-items:center;border-bottom:1px solid var(--line)}
.avatar{height:43px;width:43px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--a) 15%,white);color:var(--a);font-weight:bold}
.name{font-weight:bold;overflow-wrap:anywhere}.sub{font-size:12px;color:var(--muted);margin-top:5px;overflow-wrap:anywhere}
.results{overflow:auto;flex:1}.person{display:flex;gap:10px;align-items:center;text-align:start;width:100%;border:0;background:transparent;color:var(--txt);padding:13px 16px}
.person:hover,.person.active{background:color-mix(in srgb,var(--a) 10%,var(--panel))}
.personinfo{min-width:0}.personinfo .name,.personinfo .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:210px}
.hint{padding:22px 15px;text-align:center;color:var(--muted);font-size:14px;line-height:1.8}
.chat{display:flex;flex-direction:column}.chathead{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line);min-height:76px}
.messages{flex:1;overflow:auto;padding:20px;display:flex;flex-direction:column;gap:11px}
.bubble{max-width:80%;padding:11px 14px;background:var(--bg);border-radius:15px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55;align-self:flex-start}
.bubble.mine{background:var(--a);color:white;align-self:flex-end}
.time{font-size:10px;opacity:.7;text-align:end;margin-top:4px}
.composer{padding:13px;border-top:1px solid var(--line);display:flex;gap:9px}.composer input{flex:1;min-width:0}
.auth{max-width:420px;margin:55px auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:25px}
.auth h1{font-size:25px}.auth input{margin:7px 0}.auth .btn{width:100%;margin-top:8px}
.link{border:0;background:none;color:var(--a);padding:12px}
.status{font-size:13px;line-height:1.7;margin-top:12px;color:var(--muted);overflow-wrap:anywhere}
.hidden{display:none!important}
.overlay{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}
.overlay.open{display:flex}.modal{background:var(--panel);color:var(--txt);border-radius:18px;padding:22px;width:min(100%,390px)}
.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead h2{margin:0}
.label{display:block;margin:18px 0 8px;font-size:14px;font-weight:bold}
.colors{display:flex;gap:12px;flex-wrap:wrap}.swatch{width:34px;height:34px;border-radius:50%;border:3px solid white;outline:1px solid var(--line);padding:0}.swatch.selected{outline:3px solid var(--txt)}
.mobileback{display:none}
@media(max-width:720px){
 header{height:60px;padding:0 12px}.brand{font-size:17px}.logo{padding:8px 10px}
 main{margin:10px auto;padding:0 8px}.layout{display:block;height:calc(100dvh - 80px);min-height:400px}
 .side{height:100%}.chat{display:none;height:100%}.layout.openchat .side{display:none}.layout.openchat .chat{display:flex}
 .mobileback{display:inline-block}.messages{padding:14px}.auth{margin:25px 10px}
}
</style>
</head>
<body>
<header>
 <div class="brand"><span class="logo">N</span>NEXORA CHAT</div>
 <div style="display:flex;gap:8px">
  <button class="btn2" id="settings">⚙️ <span id="settingsText">الإعدادات</span></button>
  <button class="btn2 hidden" id="logout">خروج</button>
 </div>
</header>

<section class="auth" id="auth">
 <h1 id="authTitle">مرحبًا بك 👋</h1>
 <p id="authDesc" class="sub">سجّل دخولك أو أنشئ حسابًا للدردشة الخاصة.</p>
 <form id="authForm">
  <input id="displayName" class="hidden" placeholder="الاسم الظاهر" autocomplete="name">
  <input id="username" class="hidden" placeholder="اسم المستخدم بالإنجليزية" autocomplete="username">
  <input id="email" type="email" placeholder="البريد الإلكتروني" autocomplete="email" required>
  <input id="password" type="password" placeholder="كلمة المرور (6 أحرف على الأقل)" minlength="6" required>
  <button class="btn" id="authSubmit" type="submit">تسجيل الدخول</button>
 </form>
 <button class="link" id="switchAuth" type="button">ما عندك حساب؟ أنشئ حساب</button>
 <div class="status" id="authStatus"></div>
</section>

<main id="app" class="hidden">
 <div class="layout" id="layout">
  <aside class="panel side">
   <div class="me">
    <div class="avatar" id="myAvatar">N</div>
    <div><div class="name" id="myName">حسابي</div><div class="sub" id="myUsername"></div></div>
   </div>
   <div class="sidehead">
    <h2 id="chatListTitle">المحادثات</h2>
    <input class="search" id="search" placeholder="ابحث باسم المستخدم..." autocomplete="off">
   </div>
   <div class="results" id="results"><div class="hint">اكتب اسم المستخدم للبحث عن الأشخاص.</div></div>
   <div class="hint" style="padding:10px">دردشة خاصة فقط — بدون مجموعات.</div>
  </aside>
  <section class="panel chat">
   <div class="chathead">
    <button class="btn2 mobileback" id="back" type="button">←</button>
    <div class="avatar" id="chatAvatar">N</div>
    <div><div class="name" id="chatName">NEXORA CHAT</div><div class="sub" id="chatSub">اختر شخصًا من البحث</div></div>
   </div>
   <div class="messages" id="messages"><div class="hint">💬<br>ابحث عن مستخدم وابدأ محادثتك.</div></div>
   <form class="composer" id="sendForm">
    <input id="message" placeholder="اكتب رسالتك..." maxlength="4000" disabled>
    <button class="btn" id="send" disabled>إرسال</button>
   </form>
  </section>
 </div>
</main>

<div class="overlay" id="settingsModal">
 <div class="modal">
  <div class="modalhead"><h2 id="settingsHeading">الإعدادات</h2><button class="btn2" id="closeSettings" type="button">✕</button></div>
  <label class="label" id="colorLabel">لون الواجهة</label>
  <div class="colors">
   <button class="swatch selected" data-color="#3978f6" style="background:#3978f6" aria-label="Blue"></button>
   <button class="swatch" data-color="#805ad5" style="background:#805ad5" aria-label="Purple"></button>
   <button class="swatch" data-color="#0d9f78" style="background:#0d9f78" aria-label="Green"></button>
   <button class="swatch" data-color="#e66a35" style="background:#e66a35" aria-label="Orange"></button>
   <button class="swatch" data-color="#db4285" style="background:#db4285" aria-label="Pink"></button>
  </div>
  <label class="label" id="languageLabel" for="language">اللغة / Language</label>
  <select id="language"><option value="ar">العربية</option><option value="en">English</option></select>
  <label class="label" id="modeLabel" for="mode">المظهر</label>
  <select id="mode"><option value="light">فاتح / Light</option><option value="dark">داكن / Dark</option></select>
  <button class="btn" id="saveSettings" style="width:100%;margin-top:18px">حفظ</button>
 </div>
</div>

<script>
(() => {
'use strict';

const URL = 'https://ayfxtomfqrantxmpqgof.supabase.co';
const KEY = 'sb_publishable_2d8TzhMCRIuc6daKrObBGA_7i0jUIxe';
const db = window.supabase.createClient(URL, KEY);
const $ = id => document.getElementById(id);

let user = null, profile = null, active = null;
let signup = false, lang = 'ar', color = '#3978f6', mode = 'light';
let searchTimer = null, poller = null, contactCache = [];

const dict = {
 ar:{
  settings:'الإعدادات',logout:'تسجيل الخروج',login:'تسجيل الدخول',signup:'إنشاء حساب',
  noAccount:'ما عندك حساب؟ أنشئ حساب',hasAccount:'عندك حساب؟ سجّل دخولك',
  welcome:'مرحبًا بك 👋',loginDesc:'سجّل دخولك وابدأ الدردشة الخاصة.',
  signupDesc:'أنشئ حسابك عشان تقدر تراسل المستخدمين.',
  name:'الاسم الظاهر',username:'اسم المستخدم بالإنجليزية',email:'البريد الإلكتروني',
  password:'كلمة المرور (6 أحرف على الأقل)',chats:'المحادثات',
  search:'ابحث باسم المستخدم...',searchHint:'اكتب اسم مستخدم للبحث عن الأشخاص.',
  noResults:'ما لقينا مستخدم بهذا الاسم.',noChats:'ما عندك محادثات للحين.',
  private:'دردشة خاصة فقط — بدون مجموعات.',choose:'اختر شخصًا من البحث',
  start:'ابحث عن مستخدم وابدأ محادثتك.',message:'اكتب رسالتك...',send:'إرسال',
  color:'لون الواجهة',language:'اللغة',mode:'المظهر',save:'حفظ الإعدادات',
  light:'فاتح',dark:'داكن',error:'صار خطأ. تأكد من إعدادات Supabase وحاول مرة ثانية.',
  badLogin:'البريد الإلكتروني أو كلمة المرور غير صحيحة.',
  confirm:'شيّك بريدك الإلكتروني لتأكيد الحساب، وبعدها سجّل دخولك.',
  userTaken:'اسم المستخدم مستخدم. جرّب اسمًا ثانيًا.',
  badUsername:'استخدم حروفًا إنجليزية صغيرة وأرقامًا و _ فقط (3 إلى 24 حرفًا).',
  fill:'اكتب الاسم واسم المستخدم.',sentError:'تعذّر إرسال الرسالة. تأكد من إعدادات قاعدة البيانات.',
  settingsSaved:'تم حفظ الإعدادات.',profileError:'تعذّر تجهيز ملفك الشخصي. تأكد من الجداول والصلاحيات.',
  searchError:'تعذّر البحث. تأكد من اتصالك وإعدادات قاعدة البيانات.'
 },
 en:{
  settings:'Settings',logout:'Log out',login:'Log in',signup:'Create account',
  noAccount:"Don't have an account? Sign up",hasAccount:'Already registered? Log in',
  welcome:'Welcome 👋',loginDesc:'Log in to start private chats.',
  signupDesc:'Create an account to message users.',
  name:'Display name',username:'Username in English',email:'Email address',
  password:'Password (at least 6 characters)',chats:'Chats',
  search:'Search by username...',searchHint:'Type a username to find people.',
  noResults:'No users found.',noChats:'No chats yet.',
  private:'Private chats only — no groups.',choose:'Choose someone from search',
  start:'Find a user to start chatting.',message:'Write a message...',send:'Send',
  color:'Accent color',language:'Language',mode:'Appearance',save:'Save settings',
  light:'Light',dark:'Dark',error:'Something went wrong. Check Supabase settings and try again.',
  badLogin:'Incorrect email or password.',
  confirm:'Check your email to confirm your account, then log in.',
  userTaken:'Username taken. Try another.',
  badUsername:'Use lowercase English letters, numbers and _ only (3–24 characters).',
  fill:'Enter your name and username.',sentError:'Could not send message. Check your database setup.',
  settingsSaved:'Settings saved.',profileError:'Could not create your profile. Check table and policy setup.',
  searchError:'Search failed. Check your connection and database settings.'
 }
};
const t = k => dict[lang][k] || k;
function msg(el,s,bad=false){el.textContent=s;el.style.color=bad?'#d33':'var(--muted)';}
function initials(s){return String(s||'N').trim().slice(0,2).toUpperCase();}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function settingsApply(){
 document.documentElement.lang=lang;
 document.documentElement.dir=lang==='ar'?'rtl':'ltr';
 document.documentElement.style.setProperty('--a',color);
 document.documentElement.style.setProperty('--bg',mode==='dark'?'#151c29':'#f4f6fa');
 document.documentElement.style.setProperty('--panel',mode==='dark'?'#202b3b':'#fff');
 document.documentElement.style.setProperty('--txt',mode==='dark'?'#eef2fa':'#202638');
 document.documentElement.style.setProperty('--line',mode==='dark'?'#344155':'#e6eaf1');
 document.documentElement.style.setProperty('--muted',mode==='dark'?'#aab4c5':'#7b8495');
 $('settingsText').textContent=t('settings');
 $('settingsHeading').textContent=t('settings');
 $('colorLabel').textContent=t('color');
 $('languageLabel').textContent=t('language');
 $('modeLabel').textContent=t('mode');
 $('saveSettings').textContent=t('save');
 $('chatListTitle').textContent=t('chats');
 $('search').placeholder=t('search');
 $('message').placeholder=t('message');
 $('send').textContent=t('send');
 $('logout').textContent=t('logout');
 $('language').value=lang;
 $('mode').value=mode;
 $('authTitle').textContent=signup?t('signup'):t('welcome');
 $('authDesc').textContent=signup?t('signupDesc'):t('loginDesc');
 $('displayName').placeholder=t('name');
 $('username').placeholder=t('username');
 $('email').placeholder=t('email');
 $('password').placeholder=t('password');
 $('authSubmit').textContent=signup?t('signup'):t('login');
 $('switchAuth').textContent=signup?t('hasAccount'):t('noAccount');
 document.querySelectorAll('.swatch').forEach(b=>b.classList.toggle('selected',b.dataset.color===color));
 if(profile){
  $('myName').textContent=profile.display_name||profile.username;
  $('myUsername').textContent='@'+profile.username;
  $('myAvatar').textContent=initials(profile.display_name||profile.username);
 }
}
function loadSettings(){
 try{
  const s=JSON.parse(localStorage.getItem('nxchat.settings')||'{}');
  if(['ar','en'].includes(s.lang))lang=s.lang;
  if(/^#[0-9a-f]{6}$/i.test(s.color||''))color=s.color;
  if(['light','dark'].includes(s.mode))mode=s.mode;
 }catch(e){}
 settingsApply();
}
$('settings').onclick=()=>$('settingsModal').classList.add('open');
$('closeSettings').onclick=()=>$('settingsModal').classList.remove('open');
$('settingsModal').onclick=e=>{if(e.target===$('settingsModal'))$('settingsModal').classList.remove('open')};
document.querySelectorAll('.swatch').forEach(b=>b.onclick=()=>{color=b.dataset.color;settingsApply()});
$('language').onchange=()=>{lang=$('language').value;settingsApply();renderContacts(contactCache,$('search').value.trim())};
$('mode').onchange=()=>{mode=$('mode').value;settingsApply()};
$('saveSettings').onclick=()=>{
 try{localStorage.setItem('nxchat.settings',JSON.stringify({lang,color,mode}))}catch(e){}
 settingsApply();$('settingsModal').classList.remove('open');
};

function setSignup(v){
 signup=v;
 $('displayName').classList.toggle('hidden',!v);
 $('username').classList.toggle('hidden',!v);
 $('displayName').required=v;$('username').required=v;
 $('password').autocomplete=v?'new-password':'current-password';
 msg($('authStatus'),'');
 settingsApply();
}
$('switchAuth').onclick=()=>setSignup(!signup);

async function getProfile(authUser,preferredName='',preferredUsername=''){
 let r=await db.from('chat_profiles').select('*').eq('id',authUser.id).maybeSingle();
 if(r.error)throw r.error;
 if(r.data){profile=r.data;return profile}
 const meta=authUser.user_metadata||{};
 const display=(preferredName||meta.display_name||authUser.email?.split('@')[0]||'User').trim();
 let base=(preferredUsername||meta.username||'user').toLowerCase();
 base=base.replace(/[^a-z0-9_]/g,'').slice(0,20)||'user';
 let uname=base,n=0;
 while(true){
  const q=await db.from('chat_profiles').select('id').eq('username',uname).maybeSingle();
  if(q.error)throw q.error;
  if(!q.data||q.data.id===authUser.id)break;
  n++;uname=(base.slice(0,19)+'_'+n).slice(0,24);
 }
 r=await db.from('chat_profiles').insert({id:authUser.id,username:uname,display_name:display}).select().single();
 if(r.error)throw r.error;
 profile=r.data;return profile;
}
async function enterApp(authUser){
 user=authUser;
 await getProfile(user);
 $('auth').classList.add('hidden');
 $('app').classList.remove('hidden');
 $('logout').classList.remove('hidden');
 settingsApply();
 await loadRecent();
 showEmptyChat();
 if(poller)clearInterval(poller);
 poller=setInterval(async()=>{
  if(!user)return;
  await loadRecent(true);
  if(active)await loadMessages(true);
 },4000);
}
function showEmptyChat(){
 active=null;
 $('layout').classList.remove('openchat');
 $('chatName').textContent='NEXORA CHAT';
 $('chatSub').textContent=t('choose');
 $('chatAvatar').textContent='N';
 $('messages').innerHTML='<div class="hint">💬<br>'+esc(t('start'))+'</div>';
 $('message').disabled=true;$('send').disabled=true;
}
$('authForm').onsubmit=async e=>{
 e.preventDefault();
 const btn=$('authSubmit');btn.disabled=true;
 msg($('authStatus'),lang==='ar'?'لحظة...':'Please wait...');
 try{
  const email=$('email').value.trim(),password=$('password').value;
  if(signup){
   const name=$('displayName').value.trim();
   const uname=$('username').value.trim().replace(/^@/,'').toLowerCase();
   if(!name||!uname)throw new Error('fill');
   if(!/^[a-z0-9_]{3,24}$/.test(uname))throw new Error('badUsername');
   const r=await db.auth.signUp({email,password,options:{data:{display_name:name,username:uname}}});
   if(r.error)throw r.error;
   if(!r.data.session){msg($('authStatus'),t('confirm'));return}
   await enterApp(r.data.user);
  }else{
   const r=await db.auth.signInWithPassword({email,password});
   if(r.error)throw r.error;
   await enterApp(r.data.user);
  }
 }catch(e){
  console.error(e);
  let m=t('error');
  if(dict[lang][e.message])m=t(e.message);
  else if(e.code==='23505'||/duplicate key|unique constraint/i.test(e.message||''))m=t('userTaken');
  else if(/Invalid login credentials/i.test(e.message||''))m=t('badLogin');
  else if(/chat_profiles|row-level security|permission denied/i.test(e.message||''))m=t('profileError');
  msg($('authStatus'),m,true);
 }finally{btn.disabled=false}
};

async function loadRecent(silent=false){
 if(!user||!profile)return;
 const a=await db.from('chat_messages').select('sender_id,receiver_id,content,created_at').eq('sender_id',user.id).order('created_at',{ascending:false}).limit(100);
 const b=await db.from('chat_messages').select('sender_id,receiver_id,content,created_at').eq('receiver_id',user.id).order('created_at',{ascending:false}).limit(100);
 if(a.error||b.error){console.error(a.error||b.error);if(!silent)msg($('authStatus'),t('searchError'),true);return}
 const all=[...(a.data||[]),...(b.data||[])].sort((x,y)=>new Date(y.created_at)-new Date(x.created_at));
 const ids=[];
 all.forEach(m=>{const id=m.sender_id===user.id?m.receiver_id:m.sender_id;if(id!==user.id&&!ids.includes(id))ids.push(id)});
 let profiles=[];
 if(ids.length){
  const r=await db.from('chat_profiles').select('id,username,display_name').in('id',ids);
  if(r.error){console.error(r.error);return}
  profiles=r.data||[];
 }
 const map=new Map(profiles.map(p=>[p.id,p]));
 contactCache=ids.map(id=>map.get(id)).filter(Boolean);
 renderContacts(contactCache,$('search').value.trim());
}
function renderContacts(list,q=''){
 const el=$('results');el.innerHTML='';
 if(!list.length){
  el.innerHTML='<div class="hint">'+esc(q?t('noResults'):t('noChats'))+'</div>';return;
 }
 list.forEach(p=>{
  const b=document.createElement('button');b.className='person'+(active?.id===p.id?' active':'');
  b.innerHTML='<div class="avatar">'+esc(initials(p.display_name||p.username))+'</div><div class="personinfo"><div class="name">'+esc(p.display_name||p.username)+'</div><div class="sub">@'+esc(p.username)+'</div></div>';
  b.onclick=()=>openChat(p);el.appendChild(b);
 });
}
$('search').oninput=()=>{
 clearTimeout(searchTimer);
 const q=$('search').value.trim();
 if(!q){renderContacts(contactCache);return}
 searchTimer=setTimeout(()=>searchUsers(q),250);
};
async function searchUsers(text){
 if(!user)return;
 const q=text.trim().replace(/^@/,'').replace(/[%_]/g,'');
 if(!q){renderContacts([]);return}
 const r=await db.from('chat_profiles').select('id,username,display_name')
  .neq('id',user.id).ilike('username','%'+q+'%').order('username').limit(30);
 if(r.error){console.error(r.error);$('results').innerHTML='<div class="hint">'+esc(t('searchError'))+'</div>';return}
 const map=new Map((r.data||[]).map(p=>[p.id,p]));
 contactCache.forEach(p=>{if(p.username.toLowerCase().includes(q.toLowerCase()))map.set(p.id,p)});
 renderContacts([...map.values()],q);
}
async function openChat(p){
 active=p;
 $('chatName').textContent=p.display_name||p.username;
 $('chatSub').textContent='@'+p.username;
 $('chatAvatar').textContent=initials(p.display_name||p.username);
 $('message').disabled=false;$('send').disabled=false;
 $('layout').classList.add('openchat');
 renderContacts(contactCache,$('search').value.trim());
 await loadMessages();
}
async function loadMessages(silent=false){
 if(!active||!user)return;
 const or=`and(sender_id.eq.${user.id},receiver_id.eq.${active.id}),and(sender_id.eq.${active.id},receiver_id.eq.${user.id})`;
 const r=await db.from('chat_messages').select('id,sender_id,receiver_id,content,created_at').or(or).order('created_at',{ascending:true}).limit(300);
 if(r.error){console.error(r.error);if(!silent)$('messages').innerHTML='<div class="hint">'+esc(t('searchError'))+'</div>';return}
 const el=$('messages');
 if(!r.data?.length){el.innerHTML='<div class="hint">👋<br>'+(lang==='ar'?'ابدأ المحادثة برسالة.':'Send the first message.')+'</div>';return}
 el.innerHTML=r.data.map(m=>{
  const mine=m.sender_id===user.id;
  const d=new Date(m.created_at);
  const time=isNaN(d.getTime())?'':d.toLocaleTimeString(lang==='ar'?'ar-SA':'en-US',{hour:'2-digit',minute:'2-digit'});
  return '<div class="bubble '+(mine?'mine':'')+'">'+esc(m.content)+'<div class="time">'+esc(time)+'</div></div>';
 }).join('');
 el.scrollTop=el.scrollHeight;
}
$('sendForm').onsubmit=async e=>{
 e.preventDefault();
 if(!active||!user)return;
 const content=$('message').value.trim();if(!content)return;
 $('send').disabled=true;
 const r=await db.from('chat_messages').insert({sender_id:user.id,receiver_id:active.id,content});
 $('send').disabled=false;
 if(r.error){console.error(r.error);alert(t('sentError'));return}
 $('message').value='';
 await loadMessages();await loadRecent(true);$('message').focus();
};
$('back').onclick=()=>{$('layout').classList.remove('openchat');active=null};
$('logout').onclick=async()=>{
 const r=await db.auth.signOut();
 if(r.error){alert(t('error'));return}
 if(poller)clearInterval(poller);
 user=null;profile=null;active=null;contactCache=[];
 $('app').classList.add('hidden');$('auth').classList.remove('hidden');$('logout').classList.add('hidden');
 $('email').value='';$('password').value='';msg($('authStatus'),'');setSignup(false);
};
async function init(){
 loadSettings();setSignup(false);
 try{
  const r=await db.auth.getSession();
  if(r.error)throw r.error;
  if(r.data.session)await enterApp(r.data.session.user);
 }catch(e){console.error(e);msg($('authStatus'),t('error'),true)}
}
db.auth.onAuthStateChange(()=>{});
init();
})();
</script>
</body>
</html>
