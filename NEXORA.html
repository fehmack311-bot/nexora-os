
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXORA CHAT</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--blue:#3977f6;--bg:#f6f8fc;--line:#e7eaf0;--text:#20283a;--muted:#7b8495}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input{font:inherit}
button{border:0;border-radius:12px;padding:12px 16px;background:var(--blue);color:white;cursor:pointer}
button:disabled{opacity:.5}
input{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;outline:none;background:white;margin:5px 0}
input:focus{border-color:var(--blue)}
header{height:68px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px}
.logo{font-size:23px;font-weight:bold;color:var(--blue);letter-spacing:1px}
.muted{color:var(--muted);font-size:13px}
.auth{max-width:410px;margin:45px auto;padding:25px;background:white;border:1px solid var(--line);border-radius:20px}
.auth h1{text-align:center}
.tabs{display:flex;gap:8px;margin:20px 0}
.tabs button{flex:1;background:#eef2fa;color:#4d5b73}
.tabs button.active{background:var(--blue);color:white}
#app{display:none;max-width:1100px;margin:22px auto;padding:0 15px}
.layout{display:grid;grid-template-columns:320px 1fr;gap:16px;min-height:72vh}
.panel{background:white;border:1px solid var(--line);border-radius:18px;overflow:hidden}
.panelHead{padding:18px;border-bottom:1px solid var(--line)}
.search{padding:12px}
.users{max-height:60vh;overflow:auto}
.person{width:100%;display:flex;align-items:center;gap:11px;text-align:right;background:white;color:var(--text);border-radius:0;border-bottom:1px solid #f0f2f6;padding:14px}
.person:hover,.person.selected{background:#edf3ff}
.avatar{width:43px;height:43px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#e9efff;color:var(--blue);font-weight:bold;flex-shrink:0}
.personInfo{min-width:0;flex:1}
.personName{font-weight:bold;overflow-wrap:anywhere}
.chat{display:flex;flex-direction:column;min-height:520px}
.chatHead{padding:16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
#messages{padding:18px;flex:1;min-height:300px;max-height:55vh;overflow:auto;background:#fafbfe}
.msg{max-width:82%;width:fit-content;padding:11px 14px;border-radius:16px;margin:9px 0;background:white;border:1px solid var(--line);overflow-wrap:anywhere;white-space:pre-wrap}
.msg.mine{margin-right:auto;background:#e9f1ff;border-color:#dbe7ff}
.msg time{display:block;font-size:10px;color:var(--muted);margin-top:6px}
.send{display:flex;gap:8px;padding:13px;border-top:1px solid var(--line)}
.send input{margin:0}
.send button{flex-shrink:0}
.empty{margin:auto;text-align:center;padding:30px;color:var(--muted)}
.notice{padding:12px;border-radius:12px;background:#edf3ff;color:#315da9;margin:12px 0;overflow-wrap:anywhere}
.notice.error{background:#fff0f0;color:#b83c3c}
.notice.success{background:#eafff1;color:#187747}
.hidden{display:none!important}
.topActions{display:flex;align-items:center;gap:12px}
@media(max-width:700px){
 header{padding:0 12px}
 .logo{font-size:19px}
 #app{margin:12px auto;padding:0 9px}
 .layout{grid-template-columns:1fr;gap:10px}
 .panelHead{padding:13px}
 .users{max-height:220px}
 .chat{min-height:430px}
 #messages{min-height:260px;max-height:48vh;padding:12px}
 .auth{margin:25px 12px;padding:20px}
 .topActions .muted{display:none}
}
</style>
</head>
<body>

<header>
  <div class="logo">NEXORA <span style="color:#7b8495;font-size:12px">CHAT</span></div>
  <div class="topActions">
    <span id="currentUser" class="muted"></span>
    <button id="logout" class="hidden" onclick="logout()">خروج</button>
  </div>
</header>

<section id="auth" class="auth">
  <h1 class="logo">أهلًا بك 👋</h1>
  <p class="muted" style="text-align:center">محادثاتك الخاصة، بمكان واحد.</p>
  <div class="tabs">
    <button id="loginTab" class="active" onclick="setMode('login')">تسجيل الدخول</button>
    <button id="signupTab" onclick="setMode('signup')">حساب جديد</button>
  </div>
  <div id="signupFields" class="hidden">
    <label>اسمك الظاهر</label>
    <input id="displayName" maxlength="40" placeholder="اكتب اسمك">
    <label>اسم المستخدم</label>
    <input id="username" maxlength="24" placeholder="مثال: abdullah_1">
  </div>
  <label>البريد الإلكتروني</label>
  <input id="email" type="email" autocomplete="email" placeholder="name@example.com">
  <label>كلمة المرور</label>
  <input id="password" type="password" autocomplete="current-password" placeholder="6 أحرف على الأقل">
  <button id="authBtn" style="width:100%;margin-top:12px" onclick="authenticate()">دخول</button>
  <div id="authNotice"></div>
</section>

<section id="app">
  <div class="layout">
    <aside class="panel">
      <div class="panelHead">
        <h3 style="margin:0">المحادثات</h3>
        <p class="muted" style="margin:7px 0 0">ابحث عن مستخدم وابدأ محادثة خاصة.</p>
      </div>
      <div class="search">
        <input id="search" placeholder="ابحث باسم المستخدم..." oninput="searchUsers()">
        <div id="searchNotice"></div>
      </div>
      <div id="users" class="users">
        <div class="empty">حمّلنا حسابك...</div>
      </div>
    </aside>

    <main class="panel chat">
      <div id="chatHead" class="chatHead hidden">
        <div class="avatar" id="chatAvatar">؟</div>
        <div>
          <b id="chatName">المحادثة</b>
          <div class="muted" id="chatUsername"></div>
        </div>
      </div>
      <div id="messages">
        <div class="empty">
          <div style="font-size:42px">💬</div>
          <h3>محادثتك تبدأ هنا</h3>
          <p>اختر مستخدمًا من القائمة أو ابحث عن شخص.</p>
        </div>
      </div>
      <form id="sendForm" class="send hidden" onsubmit="sendMessage(event)">
        <input id="messageInput" maxlength="4000" placeholder="اكتب رسالتك..." autocomplete="off" required>
        <button id="sendBtn" type="submit">إرسال</button>
      </form>
    </main>
  </div>
  <div id="appNotice"></div>
  <p class="muted" style="text-align:center;padding:15px">NEXORA CHAT · دردشة خاصة</p>
</section>

<script>
const SUPABASE_URL = 'https://ayfxtomfqrantxmpqgof.supabase.co';
const SUPABASE_KEY = 'sb_publishable_2d8TzhMCRIuc6daKrObBGA_7i0jUIxe';
const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let user = null;
let profile = null;
let mode = 'login';
let activePerson = null;
let searchTimer = null;
let refreshTimer = null;
let busy = false;

const $ = id => document.getElementById(id);

function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[c]));
}

function showNotice(text, type = '', target = 'appNotice') {
  const el = $(target);
  el.innerHTML = text ? `<div class="notice ${type}">${escapeHTML(text)}</div>` : '';
}

function friendlyError(error) {
  const text = error?.message || String(error);
  if (/Invalid login credentials/i.test(text)) return 'البريد أو كلمة المرور غير صحيحة.';
  if (/Email not confirmed/i.test(text)) return 'أكد بريدك الإلكتروني أولًا، ثم سجّل الدخول.';
  if (/already registered/i.test(text)) return 'هذا البريد مسجل من قبل، جرّب تسجيل الدخول.';
  if (/row-level security|permission denied|not allowed/i.test(text)) return 'قاعدة البيانات تمنع العملية بسبب الصلاحيات. نحتاج إعداد صلاحيات الجداول.';
  if (/relation .* does not exist|schema cache/i.test(text)) return 'جداول الدردشة غير مجهزة في قاعدة البيانات حتى الآن.';
  if (/duplicate key|unique constraint/i.test(text)) return 'اسم المستخدم مستخدم، جرّب اسمًا ثانيًا.';
  return text;
}

function setMode(next) {
  mode = next;
  $('signupFields').classList.toggle('hidden', mode !== 'signup');
  $('loginTab').classList.toggle('active', mode === 'login');
  $('signupTab').classList.toggle('active', mode === 'signup');
  $('authBtn').textContent = mode === 'login' ? 'دخول' : 'إنشاء الحساب';
  $('password').autocomplete = mode === 'login' ? 'current-password' : 'new-password';
  showNotice('', '', 'authNotice');
}

async function authenticate() {
  if (busy) return;
  const email = $('email').value.trim();
  const password = $('password').value;
  if (!email || !password) {
    showNotice('اكتب البريد الإلكتروني وكلمة المرور.', 'error', 'authNotice');
    return;
  }
  if (password.length < 6) {
    showNotice('كلمة المرور لازم تكون 6 أحرف على الأقل.', 'error', 'authNotice');
    return;
  }

  let username = $('username').value.trim().replace(/^@/, '').toLowerCase();
  const displayName = $('displayName').value.trim();

  if (mode === 'signup') {
    if (!displayName) {
      showNotice('اكتب اسمك الظاهر.', 'error', 'authNotice');
      return;
    }
    if (!/^[a-z0-9_.-]{3,24}$/.test(username)) {
      showNotice('اسم المستخدم من 3 إلى 24 حرفًا، إنجليزي أو أرقام أو _ أو نقطة أو شرطة.', 'error', 'authNotice');
      return;
    }
  }

  busy = true;
  $('authBtn').disabled = true;
  showNotice('لحظة، جاري التنفيذ...', '', 'authNotice');

  try {
    if (mode === 'signup') {
      const { data, error } = await db.auth.signUp({
        email,
        password,
        options: { data: { username, display_name: displayName } }
      });
      if (error) throw error;
      if (!data.session) {
        showNotice('تم إرسال طلب إنشاء الحساب. إذا طلب Supabase تأكيد البريد، افتح رسالة التأكيد ثم سجّل الدخول.', 'success', 'authNotice');
        return;
      }
      user = data.user;
      await boot();
    } else {
      const { data, error } = await db.auth.signInWithPassword({ email, password });
      if (error) throw error;
      user = data.user;
      await boot();
    }
  } catch (error) {
    showNotice(friendlyError(error), 'error', 'authNotice');
  } finally {
    busy = false;
    $('authBtn').disabled = false;
  }
}

async function boot() {
  const { data } = await db.auth.getSession();
  user = data.session?.user || user;
  if (!user) return showAuth();

  $('auth').classList.add('hidden');
  $('app').style.display = 'block';
  $('logout').classList.remove('hidden');

  try {
    const { data: p, error } = await db.from('chat_profiles')
      .select('id,username,display_name')
      .eq('id', user.id)
      .maybeSingle();

    if (error) throw error;
    profile = p;

    if (!profile) {
      const meta = user.user_metadata || {};
      const base = String(meta.username || user.email?.split('@')[0] || 'user')
        .toLowerCase().replace(/[^a-z0-9_.-]/g, '_').slice(0, 18);
      const { data: created, error: createError } = await db.from('chat_profiles')
        .insert({
          id: user.id,
          username: base + '_' + user.id.slice(0, 4),
          display_name: meta.display_name || base
        })
        .select().single();
      if (createError) throw createError;
      profile = created;
    }

    $('currentUser').textContent = profile.display_name || profile.username;
    showNotice('');
    await loadRecentChats();
  } catch (error) {
    showNotice('تعذر تجهيز حسابك: ' + friendlyError(error), 'error');
  }
}

function showAuth() {
  user = null;
  profile = null;
  activePerson = null;
  clearInterval(refreshTimer);
  $('app').style.display = 'none';
  $('auth').classList.remove('hidden');
  $('logout').classList.add('hidden');
}

async function logout() {
  clearInterval(refreshTimer);
  const { error } = await db.auth.signOut();
  if (error) {
    showNotice(friendlyError(error), 'error', 'authNotice');
    return;
  }
  showAuth();
  showNotice('تم تسجيل الخروج.', 'success', 'authNotice');
}

function personButton(p, selected = false) {
  const name = p.display_name || p.username || 'مستخدم';
  const initial = escapeHTML(name.trim().slice(0, 2) || '؟');
  return `<button class="person ${selected ? 'selected' : ''}" onclick="openChat('${escapeHTML(p.id)}')">
    <div class="avatar">${initial}</div>
    <div class="personInfo">
      <div class="personName">${escapeHTML(name)}</div>
      <div class="muted">@${escapeHTML(p.username || '')}</div>
    </div>
  </button>`;
}

async function searchUsers() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(async () => {
    if (!user) return;
    const q = $('search').value.trim().replace(/^@/, '');
    if (q.length < 2) {
      showNotice('', '', 'searchNotice');
      await loadRecentChats();
      return;
    }

    showNotice('جاري البحث...', '', 'searchNotice');
    const { data, error } = await db.from('chat_profiles')
      .select('id,username,display_name')
      .or(`username.ilike.%${q}%,display_name.ilike.%${q}%`)
      .neq('id', user.id)
      .limit(25);

    if (error) {
      showNotice(friendlyError(error), 'error', 'searchNotice');
      return;
    }
    showNotice(data?.length ? 'نتائج البحث' : 'ما لقينا مستخدمًا بهذا الاسم.', '', 'searchNotice');
    $('users').innerHTML = (data || []).map(p => personButton(p, activePerson?.id === p.id)).join('')
      || '<div class="empty">جرّب اسم مستخدم ثاني.</div>';
  }, 300);
}

async function loadRecentChats() {
  if (!user || $('search').value.trim().length >= 2) return;
  const { data, error } = await db.from('chat_messages')
    .select('sender_id,receiver_id,created_at')
    .or(`sender_id.eq.${user.id},receiver_id.eq.${user.id}`)
    .order('created_at', { ascending: false })
    .limit(200);

  if (error) {
    $('users').innerHTML = '<div class="empty">ما قدرنا نحمل المحادثات.</div>';
    showNotice(friendlyError(error), 'error');
    return;
  }

  const ids = [...new Set((data || []).map(m =>
    m.sender_id === user.id ? m.receiver_id : m.sender_id
  ).filter(id => id && id !== user.id))];

  if (!ids.length) {
    $('users').innerHTML = '<div class="empty">ما عندك محادثات للحين.<br>ابحث عن مستخدم بالأعلى لبدء محادثة.</div>';
    return;
  }

  const { data: people, error: peopleError } = await db.from('chat_profiles')
    .select('id,username,display_name').in('id', ids);
  if (peopleError) {
    showNotice(friendlyError(peopleError), 'error');
    return;
  }

  const ordered = ids.map(id => (people || []).find(p => p.id === id)).filter(Boolean);
  $('users').innerHTML = ordered.map(p => personButton(p, activePerson?.id === p.id)).join('');
}

async function openChat(id) {
  if (!user || id === user.id) return;
  const { data: p, error } = await db.from('chat_profiles')
    .select('id,username,display_name').eq('id', id).maybeSingle();

  if (error || !p) {
    showNotice(friendlyError(error || { message: 'المستخدم غير موجود.' }), 'error');
    return;
  }

  activePerson = p;
  $('chatHead').classList.remove('hidden');
  $('sendForm').classList.remove('hidden');
  $('chatName').textContent = p.display_name || p.username;
  $('chatUsername').textContent = '@' + p.username;
  $('chatAvatar').textContent = (p.display_name || p.username || '؟').slice(0, 2);

  await refreshMessages();
  clearInterval(refreshTimer);
  refreshTimer = setInterval(refreshMessages, 4000);
  await loadRecentChats();
}

async function refreshMessages() {
  if (!user || !activePerson) return;
  const { data, error } = await db.from('chat_messages')
    .select('id,sender_id,receiver_id,content,created_at')
    .or(`and(sender_id.eq.${user.id},receiver_id.eq.${activePerson.id}),and(sender_id.eq.${activePerson.id},receiver_id.eq.${user.id})`)
    .order('created_at', { ascending: true })
    .limit(200);

  if (error) {
    showNotice(friendlyError(error), 'error');
    return;
  }

  $('messages').innerHTML = (data || []).map(m => {
    const mine = m.sender_id === user.id;
    const date = new Date(m.created_at);
    const time = isNaN(date.getTime()) ? '' : date.toLocaleTimeString('ar-SA', {hour:'2-digit', minute:'2-digit'});
    return `<div class="msg ${mine ? 'mine' : ''}">${escapeHTML(m.content)}<time>${time}</time></div>`;
  }).join('') || '<div class="empty">ابدأ المحادثة برسالة لطيفة 👋</div>';

  $('messages').scrollTop = $('messages').scrollHeight;
}

async function sendMessage(event) {
  event.preventDefault();
  if (!user || !activePerson || busy) return;

  const content = $('messageInput').value.trim();
  if (!content) return;

  busy = true;
  $('sendBtn').disabled = true;
  try {
    const { error } = await db.from('chat_messages').insert({
      sender_id: user.id,
      receiver_id: activePerson.id,
      content
    });
    if (error) throw error;
    $('messageInput').value = '';
    await refreshMessages();
    await loadRecentChats();
  } catch (error) {
    showNotice('تعذر إرسال الرسالة: ' + friendlyError(error), 'error');
  } finally {
    busy = false;
    $('sendBtn').disabled = false;
    $('messageInput').focus();
  }
}

db.auth.onAuthStateChange((event, session) => {
  if (session?.user && !user) {
    user = session.user;
    setTimeout(boot, 0);
  } else if (!session?.user && user) {
    showAuth();
  }
});

(async () => {
  const { data } = await db.auth.getSession();
  if (data.session) {
    user = data.session.user;
    await boot();
  }
})();
</script>
</body>
</html>
